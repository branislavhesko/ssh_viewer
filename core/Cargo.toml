[package]
name = "rv_core"
version = "0.1.0"
edition = "2021"
description = "Native SSH, SFTP, block cache and range server for Remote Viewer"

[lib]
name = "rv_core"
crate-type = ["cdylib"]

[dependencies]
bytes = "1.12"
futures = "0.3"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
lru = "0.19"
percent-encoding = "2.3"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py311"] }
russh = "0.65"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "fs"] }

[profile.release]
lto = "thin"
codegen-units = 4
