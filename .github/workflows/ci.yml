name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server inotify-tools libegl1 libxkbcommon0 libdbus-1-3 libpulse0
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'
          cd core && VIRTUAL_ENV=$PWD/../.venv ../.venv/bin/maturin develop --release
      - name: Test both backends against a real sshd
        run: .venv/bin/python -m pytest tests -q --timeout=60

  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel and bundle
        shell: bash
        run: |
          pip install maturin pyinstaller .
          maturin build --release -m core/Cargo.toml --out wheels
          pip install wheels/*.whl
          pyinstaller packaging/remote-viewer.spec
      - uses: actions/upload-artifact@v4
        with:
          name: remote-viewer-${{ matrix.os }}
          path: dist/
